services:
  board-live:
    build: .
    restart: unless-stopped
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Chiave LiveKit obbligatoria}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Segreto LiveKit obbligatorio}
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-}
      SUPABASE_URL: ${SUPABASE_URL:?Progetto Supabase esterno obbligatorio}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Chiave server Supabase obbligatoria}
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "3478:3478/udp"
    expose:
      - "7880"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7880').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
